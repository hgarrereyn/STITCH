[tool.poetry]
name = "stitch"
version = "0.1.0"
description = "STITCH CLI: project setup, inference, and fuzz orchestration"
authors = ["Harrison Green <harrisonmichaelgreen@gmail.com>"]
packages = [{ include = "stitch" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
openai = "1.107.1"
langchain = "0.3.17"
langchain-anthropic = "0.3.5"
langchain-openai = "0.3.3"
langchain-google-genai = "2.1.2"
langgraph = "0.2.68"
networkx = "3.2.1"
matplotlib = "3.8.3"
langchain-community = "0.3.16"
dill = "0.3.9"
tree-sitter = "0.21.3"
tree-sitter-languages = "1.10.2"
h5py = "3.13.0"
flask = "3.1.0"
rich = "13.7.1"
requests = "2.31.0"
argcomplete = "^3.5.3"

[tool.poetry.scripts]
stitch = "stitch:main"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
