<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AGF{% endblock %}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            line-height: 1.4;
            color: #333;
            font-size: 14px;
        }
        header {
            background-color: #f5f5f5;
            border-bottom: 1px solid #ddd;
            padding: 10px 20px;
            margin-bottom: 20px;
        }
        header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: normal;
        }
        main {
            padding: 0 20px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        footer {
            border-top: 1px solid #ddd;
            padding: 10px 20px;
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #777;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header>
        <h1>{% block header %}AGF{% endblock %}</h1>
    </header>
    
    <main>
        {% block content %}{% endblock %}
    </main>
    
    <footer>
        {% block footer %}AutoGraphFuzz Dashboard{% endblock %}
    </footer>
    
    {% block scripts %}{% endblock %}
</body>
</html>
