<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGraph Viewer</title>
    <link rel="stylesheet" href="styles.css">
    <!-- D3.js and dagre-d3 libraries -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/dagre-d3@0.6.4/dist/dagre-d3.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- <h1>SGraph Viewer</h1> -->
        
        <div id="drop-area">
            <p>Drag & drop a JSON file here<br>or</p>
            <input type="file" id="file-input" accept=".json">
            <label for="file-input" class="file-button">Select a file</label>
        </div>
        
        <div id="graph-container" class="hidden">
            <div id="graph-controls">
                <button id="zoom-in" title="Zoom In">+</button>
                <button id="zoom-out" title="Zoom Out">-</button>
                <button id="reset-view" title="Reset View">Reset</button>
                <button id="download-svg" title="Download SVG">Export</button>
                <button id="back-button" title="Back to File Selection">Back</button>
            </div>
            <div id="graph-view"></div>
            <div id="node-info" class="hidden">
                <div class="node-info-header">
                    <h3>Node Details</h3>
                    <button id="close-details" title="Close Details">×</button>
                </div>
                <div id="node-details"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
