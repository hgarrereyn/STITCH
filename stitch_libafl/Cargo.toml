[package]
name = "stitch_libafl"
version = "0.1.0"
authors = [""]
edition = "2021"
build = "build.rs"

[features]
default = ["std"]
std = []

[profile.release]
opt-level = 3
debug = false
overflow-checks = false
lto = true
codegen-units = 1

# [profile.release]
# opt-level = 1
# debug = "full"
# overflow-checks = true
# lto = false

[dependencies]
stitch_core = { path = "../stitch_core" }

libafl = { version = "0.14.1" }
libafl_cc = { version = "0.14.1" }
libafl_targets = { version = "0.14.1", features = [
    "libfuzzer",
    "sancov_cmplog",
    "sancov_pcguard_hitcounts",
    "pointer_maps",
] }
libafl_bolts = { version = "0.14.1" }

mimalloc = { version = "*", default-features = false }
libc = "0.2.167"
colored = "2.0.4"
serde = "*"
serde_json = "1.0.111"
clap = { version = "4.0", features = ["derive"] }
nix = { version = "0.29", features = ["fs"] }
rand = "0.8.5"
tempfile = "3.10"
simple_logger = "5.0.0"
log = { version = "^0.4.17", features = ["std"] }
libseccomp = "0.4.0"
ahash = "0.8.11"

[build-dependencies]
cc = { version = "1.0", features = ["parallel"] }

[lib]
name = "stitch_libafl"
crate-type = ["lib", "staticlib"]