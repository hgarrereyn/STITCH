[package]
name = "gf_core"
version = "0.1.0"
edition = "2021"

[dependencies]
colored = "2.0.4"
serde = { version = "*", features = ["derive"] }
serde_json = "1.0.111"
serde_with = "3.12.0"
rand = "0.8.5"
libloading = "0.8"
prost = "0.11"         # for runtime support of protobuf messages
prost-types = "0.11"
pyo3 = { version = "0.23.4", features = ["auto-initialize"] }

[dev-dependencies]
tempfile = "3.10"

[build-dependencies]
prost-build = "0.12"
cmake = "0.1"