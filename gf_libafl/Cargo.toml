[package]
name = "gf_libafl"
version = "0.1.0"
authors = ["Harrison Green"]
edition = "2021"

[features]
default = ["std"]
std = []

[profile.release]
opt-level = 0
debug = true
overflow-checks = true
lto = true

[dependencies]
gf_core = { path = "../gf_core" }

libafl = { version = "0.14.1" }
libafl_cc = { version = "0.14.1" }
libafl_targets = { version = "0.14.1", features = ["libfuzzer", "sancov_cmplog", "sancov_pcguard_hitcounts", "sanitizer_interfaces", "sancov_8bit", "pointer_maps"] }
libafl_bolts = { version = "0.14.1" }

libc = "0.2.167"
colored = "2.0.4"
serde = "*"
serde_json = "1.0.111"
clap = { version = "4.0", features = ["derive"] }
nix = { version = "0.29", features = ["fs"] }
rand = "0.8.5"
tempfile = "3.10"

[build-dependencies]
cc = { version = "1.0", features = ["parallel"] }

[lib]
name = "gf_libafl"
crate-type = ["lib", "staticlib"]